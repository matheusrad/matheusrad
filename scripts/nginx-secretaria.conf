# Nginx — proxy reverso para a VPS (opcional, mas recomendado)
# Coloque em: /etc/nginx/sites-available/secretaria-dental
# Ative: ln -s /etc/nginx/sites-available/secretaria-dental /etc/nginx/sites-enabled/
# Teste: nginx -t && systemctl reload nginx
#
# Substitua SEU_DOMINIO_OU_IP pelo IP ou domínio real.

server {
    listen 80;
    server_name SEU_DOMINIO_OU_IP;

    # Compressão
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Proxy para o Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Arquivos estáticos do Next.js com cache longo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Para HTTPS com Let's Encrypt:
# certbot --nginx -d SEU_DOMINIO
